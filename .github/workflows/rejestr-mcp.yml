name: Rejestr MCP

# Publikacja server.json w oficjalnym rejestrze MCP (registry.modelcontextprotocol.io).
# Uruchamiana wyłącznie ręcznie (Actions → Rejestr MCP → Run workflow).
# Logowanie przez GitHub OIDC: rejestr widzi, że żądanie przychodzi z repozytorium
# organizacji leniwyposel, więc nie trzeba ujawniać członkostwa żadnej osoby w organizacji.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publikacja:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wersje w server.json i package.json muszą się zgadzać
        run: |
          s=$(jq -r .version server.json); p=$(jq -r .version package.json)
          n=$(jq -r .mcpName package.json); m=$(jq -r .name server.json)
          test "$s" = "$p" || { echo "server.json $s ≠ package.json $p"; exit 1; }
          test "$n" = "$m" || { echo "mcpName $n ≠ name $m"; exit 1; }
      - name: mcp-publisher 1.8.1 (suma kontrolna przypięta)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
